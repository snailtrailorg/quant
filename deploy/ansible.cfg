# ansible 运行配置 —— 一律从 deploy/ 目录启动 playbook（本文件才会被发现）
# 用法示例:
#   deploy/.venv/bin/ansible-playbook playbooks/release.yml -i inventory/sandbox.yml
[defaults]
# 缺省指向沙箱（安全缺省）；生产必须显式 -i inventory/quant-prod.yml
inventory = inventory/sandbox.yml
# ansible.posix 等 vendor collection 的离线解析路径（CN 网络可复现，设计稿"产出"节）
collections_path = ./collections
roles_path = ./roles
# host_key_checking=False 仅服务沙箱 local 连接；远程主机（quant-prod）由 inventory
# per-host ansible_ssh_common_args='accept-new' 收紧（TOFU），见 inventory/quant-prod.yml
host_key_checking = False
retry_files_enabled = False
forks = 1
# 显式 inventory 解析器由各 inventory 文件给出（设计稿 §7：显式 ansible_python_interpreter）
interpreter_python = auto_silent
