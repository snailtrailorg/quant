# 全组通用参数（sandbox 与 quant-prod 共用的结构/验证参数，设计稿 §3）
---
# ---- release_id 约束（wrapper 同款正则，preflight 断言）----
deploy_release_id_regex: '^[0-9]{12}-[a-f0-9]{7,}$'

# ---- 前置断言参数 ----
deploy_min_disk_mb: 500              # 磁盘余量闸（设计稿 §3 preflight；venv 重建 1.5G 闸属 3b-1 步骤 1）
deploy_trading_windows:              # 发布禁区（TZ=Asia/Shanghai；周一~周五）。闸拦**启动**时刻，
                                     # 边界含完成时长让位（2026-09-01 用户裁定：启动≠完成，全弧 ~15min）：
  - {begin: 855, end: 1135}          # 盘前让 20 分钟（竞价 9:15 前 8:55 启动截止——完成必落竞价前）
  - {begin: 1240, end: 1505}         # 午休 11:35 起发，12:40 启动截止（12:55 前必完成）；盘后让 5 分钟

# ---- 四切片指纹（排 __pycache__；空输出=视为变更——设计稿 §3 preflight）----
# scripts 取 systemd 子树：单元变更判据（场景 6 install-units 触发条件）
deploy_slices: [src, migrations, scripts/systemd, requirements.txt, alembic.ini]
                                     # 批 8 补 alembic.ini（同步白名单有而指纹无=完备性缺口——server_changed 判据须覆盖全部 server 输入）
                                     # 注：scripts/ 非 systemd 子树=按需脚本（backup/init 等），新起进程经 run-current 即取新树，
                                     # 故意不入指纹；shared/.env 与 shared/venv 管道外（quant 600 不可读），改它们须 -e force_full=true
deploy_postverify_probe: false        # W2 兜底：探针默认关（环境显式开；沙箱 web 桩无端点）

# ---- 发布同步白名单（设计稿 §3：synchronize 白名单清单，非全树 rsync）----
deploy_sync_whitelist:
  - {path: src, dir: true}
  - {path: migrations, dir: true}
  - {path: scripts, dir: true}
  - {path: alembic.ini, dir: false}
  - {path: requirements.txt, dir: false}

# ---- 波次稳定窗（设计稿 §3 注记②：无原生 dwell，循环实现）----
deploy_dwell_seconds: 30             # is-active 需连续保持的秒数（沙箱压缩覆盖）
deploy_dwell_poll: 2                 # 采样间隔
deploy_dwell_max_wait: 120           # 单元总等待上限（含反复重启拉锯）

# ---- 清理策略（设计稿 §3 post_tasks）----
deploy_keep_releases: 5              # 按 release_id 字典序保留 N 个已部署版
# ---- 批 8 · 变更感知发布 ----
# server_changed=false（四切片+units 指纹全一致）→ 快车道：跳阶段 3/5/7（导入冒烟/pip/alembic/波次重启），
# 只走同步+双链 flip+postverify（pinned 断言=旧版）。逃生门：-e force_full=true 恒走全量。
# dwell 压缩：-e deploy_dwell_seconds=10（快速模式，默认 30 保守值不变）。
