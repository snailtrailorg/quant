# grype-install.yml —— 批 123：grype+syft 装机（一次性工具安装，非部署管道）
#
# 设计依据：`flow/任务/批123-漏洞源重构.md` §二.1 装机通道 + A07 §八。
# 探查实证（2026-10-14）：GitHub 直连不可达（本机+prod 22/443/https 全断）——
# 二进制由**本机经 spe 代理下载后**随本 playbook 的 files/ 推送（通道 a 变体：
# 不依赖运行时下载，产物进仓外缓存 deploy/files-grype/，gitignore）。
#
# 与 bootstrap.yml 的关系：bootstrap 管 wrapper/sudoers（服务器侧机制）；
# 本册管外部工具二进制（grype/syft——版本升级重跑本册，同「变更⇒重装位」规约）。
# DB 不在装机范围：首跑 `grype db update` 由扫描任务自拉（anchore 源 prod 已验
# 通 296MB/106s；DB 属主须与运行身份一致——本册以 quant 身份预拉一次，
# 落 /home/quant/.cache/grype/，防 06:00 首扫以 root 家目录找不到 DB 再全量拉）。
#
# 权限：二进制 root:root 755 装 /usr/local/bin（同 wrapper 属主惯例）。
#       DB 预拉经 michael root 一次性 `sudo -u quant`（用户裁定 2026-10-14：
#       装机是一次性事件，不为 grype 新开 sudoers/wrapper 面——worker 平时
#       调 grype 是普通进程调用零 sudo）。
#
# 用法（非交易时段）:
#   .venv/bin/ansible-playbook playbooks/grype-install.yml -i inventory/quant-prod.yml
#   （前置：本机 files-grype/ 已放 grype+syft 二进制——见 pre_tasks 断言报错指引）
---
- hosts: all
  gather_facts: false
  become: false
  vars:
    _grype_local_dir: "{{ playbook_dir }}/files-grype"
    _tool_dir: /usr/local/bin
    _quant_home: /home/quant

  tasks:
    # 产物分发=外部前置（操作机 curl 经代理下载 → 推各环境 /tmp/quant-{grype,syft}.new）：
    # staging 的 localhost=deploy@127.0.0.1（真 ssh 同机），读不到控制机家目录——
    # ansible copy 的 src 也走同通道（实际由 controller 推送但权限随 deploy），实测
    # Permission denied。/tmp 中转=两环境同构（deploy 可读，root install 收尾）。
    - name: grype-install —— 远端 /tmp 产物就绪断言（缺则拒并给分发指引）
      ansible.builtin.stat:
        path: "/tmp/quant-{{ item }}.new"
      register: _remote_bin
      loop: [grype, syft]
      failed_when: not _remote_bin.stat.exists
      changed_when: false

    - name: grype-install —— root 装位指引（michael break-glass：deploy 无 /usr/local/bin 写权——staging 实证 Permission denied）
      ansible.builtin.debug:
        msg: >-
          michael root 手工两条（同 wrapper 属主惯例 root:root 755）：
          install -o root -g root -m 755 /tmp/quant-grype.new /usr/local/bin/grype &&
          install -o root -g root -m 755 /tmp/quant-syft.new /usr/local/bin/syft

    - name: grype-install —— 装位完成探测（michael 手工后重跑本册即过此闸）
      ansible.builtin.stat:
        path: "{{ _tool_dir }}/grype"
      register: _installed

    - name: grype-install —— 未装位提示（首次跑=正常路径，非失败）
      ansible.builtin.debug:
        msg: "二进制尚未装位（michael 手工步骤未执行）——装位后重跑本册出终验。"
      when: not _installed.stat.exists

    - name: grype-install —— 版本留痕（装机台账——升级比对用）
      ansible.builtin.command: "{{ _tool_dir }}/{{ item }} version"
      loop: [grype, syft]
      register: _ver
      when: _installed.stat.exists
      changed_when: false

    - name: grype-install —— DB 预拉占位（michael root 手工：sudo -u quant /usr/local/bin/grype db update）
      ansible.builtin.debug:
        msg: >-
          DB 就位已由 michael 完成（2026-10-15 两环境：~/ 迁移至 shared/grype-db——
          3.1GB 纯文件搬移非重下载，grype DB 自包含无绝对路径内嵌）。今后 DB 重建
          （目录损坏等）才需：sudo -u quant env \
          GRYPE_DB_CACHE_DIR=/data/websites/snailtrail.cc/quant/shared/grype-db \
          /usr/local/bin/grype db update

    - name: grype-install —— DB 落位核验（装位+预拉后重跑时验——shared/grype-db 部署树）
      ansible.builtin.stat:
        path: "/data/websites/snailtrail.cc/quant/shared/grype-db"
      register: _dbdir
      when: _installed.stat.exists
      failed_when: _dbdir.stat.exists is defined and not _dbdir.stat.exists
      changed_when: false

    - name: grype-install —— 装机完成摘要（版本+DB——留 runbook 级日志）
      ansible.builtin.debug:
        msg: >-
          grype={{ (_ver.results[0].stdout_lines | default([])) | select('match', 'Version') | list | join(' ') }},
          syft={{ (_ver.results[1].stdout_lines | default([])) | select('match', 'Version') | list | join(' ') }},
          db=/data/websites/snailtrail.cc/quant/shared/grype-db
      when: _installed.stat.exists
