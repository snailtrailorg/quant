# Alembic 配置（quant，URL 由 migrations/env.py 从 .env 的 QUANT_DB_URL 覆盖）
[alembic]
script_location = migrations
# sqlalchemy.url 留空，env.py 从 QUANT_DB_URL 读取并覆盖
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname = root

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
