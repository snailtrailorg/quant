# nginx vhost for quant
# 用法: 手工同步——服务器实际配置以 /etc/nginx/conf.d/quant.conf 为准做 diff 后合并
#       （2026-08-18 教训：repo 版曾过时为 port80 无 TLS，直接 cp 会降级掉生产 HTTPS）
# 部署路径: /data/websites/snailtrail.cc/quant/{server,web}
# 后端: 127.0.0.1:8001 (uvicorn)
#
# 2026-10-11 安全评估 #4 增补（diff 合并时只取标 [SEC] 的行，其余勿动现网）：
#   a) server_tokens off + 4 安全头（HSTS/X-Frame/nosniff/基础 CSP）
#   b) 激活既有 /etc/nginx/conf.d/security.conf 的全局 limit zone——但仅套在登录端点
#      （整站 10r/s 会误伤轮询面板；UA 白名单 map 不启用——curl/API 客户端非浏览器会被 403）

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quant.snailtrail.cc;

    # [SEC-a] 隐藏版本号（安全评估 #4）
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/snailtrail.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snailtrail.cc/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # [SEC-a] 安全头（安全评估 #4：缺失实测）
    # HSTS：浏览器 180 天内强制 https（本站纯 https，无降级场景）
    add_header Strict-Transport-Security "max-age=15552000" always;
    # 点击劫持：禁止被 iframe 嵌入（无嵌入需求，DENY 最严）
    add_header X-Frame-Options "DENY" always;
    # 类型嗅探：禁浏览器猜文件类型
    add_header X-Content-Type-Options "nosniff" always;
    # CSP：默认全限 self——SPA 静态资源同源；API 无内联脚本需求。
    # style 'unsafe-inline'：Element Plus 组件库内联样式所需（去掉会白屏——先宽后紧）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

    # 载入你统一的安全防护规则
    #include /etc/nginx/security-rules.conf;

    # [SEC-b] 登录端点限速（安全评估 #3 nginx 层兜底——应用层另有 u:/ip: 双钥只记失败的
    # 精细限速，此处是粗兜底：同 IP 对登录打 >30r/m 才拦。局域网连坐分析：
    # 正常用户登录频率分钟级 1-2 次，30/m 阈值只有爆破脚本会触碰；
    # zone 定义在 security.conf 已有（security_limit 10r/s），此处用 burst 令牌桶语义）
    location = /api/auth/login {
        limit_req zone=security_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8001/health;
    }

    location /healthz {
	proxy_pass http://127.0.0.1:8001/healthz;
    }

    # 15-服务监控 SM1a：/metrics /readyz 路由 + 限源（此前落 SPA catch-all 返回 200 index.html——
    # 外部拉指标静默拿空。只许内网/NAS Zabbix/本机，防公网暴露运维信息）
    location = /readyz {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8001;
    }

    # W2（2026-09-01）：部署探针——与 /readyz 同待遇（内网 allowlist）；端点另有
    # X-Real-IP 内卫兜底（本规则装位前的窗口期外网流已被内卫 403）
    location = /api/_probe {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8001;
    }

    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8001;
    }

    # SPA 静态文件。index.html 不缓存（I 审：发版后旧 bundle 持续打已删动词=405 直到手动刷新）
    location = /index.html {
        root /data/websites/snailtrail.cc/quant/web;
        add_header Cache-Control "no-cache";
    }
    location / {
        root /data/websites/snailtrail.cc/quant/web;
        try_files $uri $uri/ /index.html;
    }
}

# ─── 合并操作说明（给装位者，2026-10-11）────────────────────────────
# 1) diff 本文件与 /etc/nginx/conf.d/quant.conf，只合并标 [SEC] 的块：
#    - server_tokens off + 4 个 add_header（放 ssl 段后）
#    - location = /api/auth/login 新块（放 location /api/ 之前——精确匹配优先，但显式前置防误并）
# 2) security.conf 的 zone（security_limit）已存在现网，无需改动；
#    ⚠ 不要启用其 UA 白名单 map（$is_allowed_browser）——curl/API 客户端与内网 Zabbix 会被 403。
# 3) 上线验证三步：
#    nginx -t && nginx -s reload
#    curl -skI https://quant.snailtrail.cc/ | grep -iE 'strict-transport|x-frame|nosniff|content-security'  # 应 4 行
#    for i in $(seq 1 40); do curl -sk -o /dev/null -w '%{http_code} ' -X POST https://quant.snailtrail.cc/api/auth/login -H 'Content-Type: application/json' -d '{"username":"x","password":"y"}'; done; echo
#    # 预期：约前 ~30 个 401，其后出现 429（nginx 兜底生效）；正常单次登录不受影响
# 4) 回滚：删 [SEC] 两块 reload 即回原状（无破坏性变更）。
