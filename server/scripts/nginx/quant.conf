# nginx vhost for quant（IP 访问，无 HTTPS）
# 用法: sudo cp 到 /etc/nginx/conf.d/quant.conf && sudo nginx -t && sudo systemctl reload nginx
# 部署路径: /data/websites/snailtrail.cc/quant/{server,web}
# 后端: 127.0.0.1:8001 (uvicorn)

server {
    listen 80;
    server_name quant.snailtrail.cc;

    # API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /health {
        proxy_pass http://127.0.0.1:8001/health;
    }

    # 15-服务监控 SM1a：/metrics /readyz 路由 + 限源（此前落 SPA catch-all 返回 200 index.html——
    # 外部拉指标静默拿空。只许内网/NAS Zabbix/本机，防公网暴露运维信息）
    location = /readyz {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8001;
    }
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8001;
    }

    # SPA 静态文件
    location / {
        root /data/websites/snailtrail.cc/quant/web;
        try_files $uri $uri/ /index.html;
    }
}
