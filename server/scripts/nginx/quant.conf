# nginx vhost for quant —— 与 /etc/nginx/conf.d/quant.conf 保持同步（可整文件替换）
# 部署路径: /data/websites/snailtrail.cc/quant/{server,web}
# 后端: 127.0.0.1:8001 (uvicorn)
# ⚠ /etc/nginx/security-rules.conf 保持注释不启用：UA 过滤会 403 curl/Zabbix/部署探针，
#   方法过滤会 405 本仓 DELETE 端点，后缀黑名单含 .json 伤静态资源。
# 替换步骤：备份现网 → 本文件覆盖 → nginx -t && nginx -s reload →
#   curl -skI https://quant.snailtrail.cc/ | grep -iE 'strict-transport|x-frame|nosniff|content-security'（应 4 行）

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quant.snailtrail.cc;
    ssl_certificate /etc/letsencrypt/live/snailtrail.cc/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/snailtrail.cc/privkey.pem; # managed by Certbot

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 隐藏版本号
    server_tokens off;

    # 安全头：HSTS 180 天强制 https；禁 iframe；禁类型嗅探；CSP 默认 self
    #（style unsafe-inline 为 Element Plus 所需）
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

    # 登录端点限速（应用层另有 u:/ip: 双钥只记失败限速，此处粗兜底；
    # zone=security_limit 定义在 conf.d/security.conf）
    location = /api/auth/login {
        limit_req zone=security_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8001/health;
    }

    location /healthz {
	proxy_pass http://127.0.0.1:8001/healthz;
    }

    # /metrics /readyz 限内网（防公网暴露运维信息）
    location = /readyz {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8001;
    }

    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8001;
    }

    # SPA 静态文件。index.html 不缓存（发版后旧 bundle 打已删端点=405 直到手动刷新）。
    # ⚠ 安全头须在此块重复声明：nginx 规则——location 内出现任何 add_header 时，
    #   server 级 add_header 全部不继承（缺此 4 行则首页无安全头）。
    location = /index.html {
        root /data/websites/snailtrail.cc/quant/web;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;
    }
    location / {
        root /data/websites/snailtrail.cc/quant/web;
        try_files $uri $uri/ /index.html;
    }

}
