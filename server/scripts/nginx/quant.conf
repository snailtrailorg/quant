# nginx vhost for quant
# 用法: 手工同步——服务器实际配置以 /etc/nginx/conf.d/quant.conf 为准做 diff 后合并
#       （2026-08-18 教训：repo 版曾过时为 port80 无 TLS，直接 cp 会降级掉生产 HTTPS）
# 部署路径: /data/websites/snailtrail.cc/quant/{server,web}
# 后端: 127.0.0.1:8001 (uvicorn)

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quant.snailtrail.cc;

    ssl_certificate     /etc/letsencrypt/live/snailtrail.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snailtrail.cc/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 载入你统一的安全防护规则
    #include /etc/nginx/security-rules.conf;

    # API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8001/health;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8001/healthz;
    }

    # 15-服务监控 SM1a：/metrics /readyz 路由 + 限源（此前落 SPA catch-all 返回 200 index.html——
    # 外部拉指标静默拿空。只许内网/NAS Zabbix/本机，防公网暴露运维信息）
    location = /readyz {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8001;
    }

    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8001;
    }

    # SPA 静态文件
    location / {
        root /data/websites/snailtrail.cc/quant/web;
        try_files $uri $uri/ /index.html;
    }
}

