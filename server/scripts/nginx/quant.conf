# nginx vhost for quant
# 用法: 手工同步——服务器实际配置以 /etc/nginx/conf.d/quant.conf 为准做 diff 后合并
#       （2026-08-18 教训：repo 版曾过时为 port80 无 TLS，直接 cp 会降级掉生产 HTTPS）
# 部署路径: /data/websites/snailtrail.cc/quant/{server,web}
# 后端: 127.0.0.1:8001 (uvicorn)
#
# 2026-10-11 安全评估 #4：本版与 prod 现网（6aa28c5 取回）**整文件等价**——基底即
# 现网原文，仅含 [SEC] 三块增补（server_tokens/4 安全头/登录限速 location），可
# 整文件替换 /etc/nginx/conf.d/quant.conf（替换前备份；文件头注释不入 server 块）。
# ⚠ /etc/nginx/security-rules.conf（UA 白名单等 WordPress 风格规则包）维持注释不启用
#   ——UA 过滤会 403 curl/Zabbix/部署探针，方法过滤会 405 仓内 DELETE 端点。

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quant.snailtrail.cc;
    ssl_certificate /etc/letsencrypt/live/snailtrail.cc/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/snailtrail.cc/privkey.pem; # managed by Certbot

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # [SEC-a] 隐藏版本号（安全评估 #4）
    server_tokens off;

    # [SEC-a] 安全头（安全评估 #4）
    # HSTS：180 天强制 https（纯 https 站无降级场景）
    add_header Strict-Transport-Security "max-age=15552000" always;
    # 点击劫持：禁 iframe 嵌入（无嵌入需求，DENY 最严）
    add_header X-Frame-Options "DENY" always;
    # 类型嗅探：禁浏览器猜类型
    add_header X-Content-Type-Options "nosniff" always;
    # CSP：默认 self；style unsafe-inline 为 Element Plus 所需（先宽后紧）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

    # 载入你统一的安全防护规则（security-rules.conf 保持注释——见文件头 ⚠）
    #include /etc/nginx/security-rules.conf;

    # [SEC-b] 登录端点限速（应用层已有 u:/ip: 双钥只记失败限速，此处 nginx 粗兜底：
    # 同 IP 10r/s+burst20——正常登录分钟级 1-2 次永不触碰；zone 定义在 security.conf）
    location = /api/auth/login {
        limit_req zone=security_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8001/health;
    }

    location /healthz {
	proxy_pass http://127.0.0.1:8001/healthz;
    }

    # 15-服务监控 SM1a：/metrics /readyz 路由 + 限源（此前落 SPA catch-all 返回 200 index.html——
    # 外部拉指标静默拿空。只许内网/NAS Zabbix/本机，防公网暴露运维信息）
    location = /readyz {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8001;
    }

    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8001;
    }

    # SPA 静态文件
    location / {
        root /data/websites/snailtrail.cc/quant/web;
        try_files $uri $uri/ /index.html;
    }

}
