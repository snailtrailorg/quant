# LLM 网关 · failover 策略（模型配置已 DB 化 llm_model_config）
# 2026-08-07：移除 tier/lang（决策见 flow/decisions.md）+ P1.8 清理 tiers/providers 死配置
# 仅保留 failover（模型型号规格以官方为准，接入时回填到 DB llm_model_config）
failover:
  triggers: [http_5xx, http_429, timeout, quota_exceeded]
  retry_wait_s: 2
  circuit_breaker:
    fail_threshold: 5
    pause_s: 300
